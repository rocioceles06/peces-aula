<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
        <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    </head>
    <body>
        <a-scene mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 6" mindar-image="filterMinCF:0.0001; filterBeta: 0.001" xr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
            <!--a-assets-->
                <!--img id="card" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.png" /-->
                <!--a-asset-item id="abisal1" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/softmind/scene.gltf"></a-asset-item-->
            <!--/a-assets-->
            <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
            <a-entity mindar-image-target="targetIndex: 0">
                <!-- PEZ DIABLO NEGRO -->
                <a-gltf-model rotation="90 0 0 " position="0 0 0.1" scale="1 1 1" src="https://cdn.tinyglb.com/models/cc679d066f4549409a3e44cc22611541.glb" animation-mixer="clip: *;">
            </a-entity>
            <a-entity mindar-image-target="targetIndex: 1">
                <!-- PEZ DEMONIO-->
                <a-gltf-model rotation="90 0 0 " position="0 -0.5 0.1" scale="0.3 0.3 0.3" src="https://cdn.tinyglb.com/models/44c85b7eaff64380b9205fa14067f3a9.glb" animation-mixer="clip: *;"></a-gltf-model>
            </a-entity>
            <a-entity mindar-image-target="targetIndex: 2">
                <!-- TRIPODE-->
                <a-gltf-model rotation="90 0 0 " position="0 0 0.8" scale="2 2 2" src="https://cdn.tinyglb.com/models/1b47f23aea6d4fef954535d37d48fbb6.glb" animation-mixer="clip: *;"></a-gltf-model>
            </a-entity>
            <a-entity mindar-image-target="targetIndex: 3">
                <!-- SNAILFISH-->
                <a-gltf-model rotation="90 0 0 " position="0 0 0.1" scale="2 2 2" src="https://cdn.tinyglb.com/models/077e9dc48b554918a64f39c08dc0f32a.glb" animation-mixer="clip: *;"></a-gltf-model>
            </a-entity>
            <a-entity mindar-image-target="targetIndex: 4">
                <!-- PULPO DUMBO-->
                <a-gltf-model rotation="90 0 0 " position="0 0 1" scale="0.7 0.7 0.7" src="https://cdn.tinyglb.com/models/1375443df9a64e06a2a313b4ab84a587.glb" animation-mixer="clip: *;"></a-gltf-model>
            </a-entity>
            <a-entity mindar-image-target="targetIndex: 5">
                <!-- CONJUNTO -->
                <a-gltf-model rotation="90 0 0 " position="0 0 0.1" scale="4 4 4" src="https://cdn.tinyglb.com/models/fd21ea1980a84a4e846fa134bad2a55e.glb" animation-mixer="clip: *;">
            </a-entity>
        </a-scene>
    </body>
</html>
